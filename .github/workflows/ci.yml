name: Pull Request CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate pull request
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - name: Check out the pull request merge commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.18.0"
          cache: npm

      - name: Verify build environment
        shell: bash
        run: |
          set -euo pipefail
          test -d "$DEVELOPER_DIR"
          xcrun --find swift
          xcodebuild -version | grep -Fx 'Xcode 26.3'
          swift --version
          swift build --build-system swiftbuild --package-path native/transport --scratch-path "$RUNNER_TEMP/swiftbuild-probe" --show-bin-path
          test "$(uname -m)" = "arm64"
          test "$(node --version)" = "v24.18.0"
          npm --version | grep -Eq '^11\.'

      - name: Install locked dependencies
        run: npm ci

      - name: Run TypeScript tests
        run: npm run test

      - name: Run type checking
        run: npm run typecheck

      - name: Run linting
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Build native helper
        run: npm run build:native

      - name: Run native tests
        run: npm run test:native

      - name: Build plugin
        run: npm run build

      - name: Verify package staging content
        run: npm run verify:package
