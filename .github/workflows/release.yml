name: Automatic Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-15
    permissions:
      contents: read
    outputs:
      artifact_name: ${{ steps.metadata.outputs.artifact_name }}
      release_notes_path: ${{ steps.metadata.outputs.release_notes_path }}
      release_notes_sha256: ${{ steps.metadata.outputs.release_notes_sha256 }}
      tag: ${{ steps.metadata.outputs.tag }}
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - name: Check out the triggering commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.18.0"
          cache: npm

      - name: Verify build environment
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "arm64"
          test "$(node --version)" = "v24.18.0"
          npm --version | grep -Eq '^11\.'

      - name: Install locked dependencies
        run: npm ci

      - name: Validate release metadata
        id: metadata
        run: node scripts/release-metadata.mjs --github-output "$GITHUB_OUTPUT"

      - name: Install verified IINA packaging CLI
        shell: bash
        env:
          IINA_SHA256: dd0fc0bd4b37fb57a1c8d30d6e3201b3a64bafd29959fe56953964613237beb1
          IINA_URL: https://github.com/iina/iina/releases/download/v1.4.4/IINA.v1.4.4.dmg
        run: |
          set -euo pipefail
          dmg="$RUNNER_TEMP/IINA.v1.4.4.dmg"
          mount="$RUNNER_TEMP/iina-mount"
          app="$RUNNER_TEMP/IINA.app"
          curl --fail --location --retry 3 --output "$dmg" "$IINA_URL"
          echo "$IINA_SHA256  $dmg" | shasum -a 256 --check
          mkdir -p "$mount"
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mount"
          trap 'hdiutil detach "$mount" >/dev/null' EXIT
          cp -R "$mount/IINA.app" "$app"
          test -x "$app/Contents/MacOS/iina-plugin"
          echo "IINA_PLUGIN_BIN=$app/Contents/MacOS/iina-plugin" >> "$GITHUB_ENV"

      - name: Run TypeScript tests
        run: npm run test

      - name: Run type checking
        run: npm run typecheck

      - name: Run linting
        run: npm run lint

      - name: Build native helper
        run: npm run build:native

      - name: Run native tests
        run: npm run test:native

      - name: Build plugin
        run: npm run build

      - name: Verify package staging content
        run: npm run verify:package

      - name: Pack release archive
        run: npm run pack

      - name: Record successful release gates
        run: >-
          node -e 'require("node:fs").writeFileSync("build/release-gates.json",
          JSON.stringify({test:true,typecheck:true,lint:true,buildNative:true,
          testNative:true,build:true,verifyPackage:true,pack:true}))'

      - name: Audit final release archive
        run: >-
          node scripts/audit-release.mjs
          --artifact "${{ steps.metadata.outputs.artifact_path }}"
          --expected-version "${{ steps.metadata.outputs.version }}"
          --expected-github-repository "${{ steps.metadata.outputs.github_repository }}"
          --expected-github-version "${{ steps.metadata.outputs.github_version }}"
          --expected-commit "$GITHUB_SHA"
          --build-helper dist/native/subtandem-transport
          --build-extractor dist/native/subtandem-subtitle-extractor
          --ffmpeg-source native/.build/ffmpeg/downloads/ffmpeg-8.1.2.tar.xz
          --ffmpeg-lock native/ffmpeg.lock.json
          --gates build/release-gates.json
          --release-notes "${{ steps.metadata.outputs.release_notes_path }}"
          --release-notes-sha256 "${{ steps.metadata.outputs.release_notes_sha256 }}"
          --summary-file "$GITHUB_STEP_SUMMARY"
          --output-dir build/release

      - name: Upload audited release payload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-${{ steps.metadata.outputs.tag }}
          path: build/release/
          if-no-files-found: error
          retention-days: 7

  publish:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out the publishing interface
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.18.0"

      - name: Download audited release payload
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-${{ needs.build.outputs.tag }}
          path: build/release

      - name: Publish or safely resume the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          node scripts/publish-release.mjs
          --repository "$GITHUB_REPOSITORY"
          --version "${{ needs.build.outputs.version }}"
          --tag "${{ needs.build.outputs.tag }}"
          --commit "$GITHUB_SHA"
          --assets-dir build/release
          --notes-file build/release/release-notes.md
